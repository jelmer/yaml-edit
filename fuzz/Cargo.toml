[package]
name = "yaml-edit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rowan = "0.16"
arbitrary = { version = "1", features = ["derive"] }
saphyr = "0.0.12"

[dependencies.yaml-edit]
path = ".."

[[bin]]
name = "parse_yaml"
path = "fuzz_targets/parse_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_yaml"
path = "fuzz_targets/edit_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multi_document"
path = "fuzz_targets/multi_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutation_invariants"
path = "fuzz_targets/mutation_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plain_scalar_saphyr"
path = "fuzz_targets/plain_scalar_saphyr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quoted_scalar_saphyr"
path = "fuzz_targets/quoted_scalar_saphyr.rs"
test = false
doc = false
bench = false
